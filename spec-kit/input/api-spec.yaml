openapi: 3.1.0
info:
  title: Level Up Habit Tracker — Internal Client & Storage Interface
  version: 1.0.0
  description: >
    Especificación de contratos para la interfaz de servicios y almacenamiento local
    de Level Up Habit Tracker (Client-Side Storage API & State Management).
servers:
  - url: client://local-storage/v1
    description: Almacenamiento local del navegador (LocalStorage API)

paths:
  /habits:
    get:
      summary: Obtener todos los hábitos activos con sus estadísticas computadas
      operationId: getHabits
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, completed, pending, streaking]
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de hábitos recuperada exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Habit'
    post:
      summary: Crear un nuevo hábito
      operationId: createHabit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHabitDto'
      responses:
        '201':
          description: Hábito creado y persistido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'

  /habits/{id}:
    put:
      summary: Actualizar un hábito existente
      operationId: updateHabit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHabitDto'
      responses:
        '200':
          description: Hábito actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
    delete:
      summary: Eliminar un hábito
      operationId: deleteHabit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Hábito eliminado de la persistencia

  /habits/{id}/toggle:
    post:
      summary: Alternar estado de completitud (Check-in) para una fecha (por defecto hoy)
      operationId: toggleHabitCheckIn
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  description: Fecha en formato YYYY-MM-DD
      responses:
        '200':
          description: Estado de check-in actualizado y rachas recalculadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResult'

  /stats/dashboard:
    get:
      summary: Obtener resumen consolidado para el dashboard principal
      operationId: getDashboardStats
      responses:
        '200':
          description: Estadísticas globales calculadas en tiempo real
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'

  /system/seed:
    post:
      summary: Restaurar o inicializar datos de demostración
      operationId: resetSeedData
      responses:
        '200':
          description: Datos semilla restaurados
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  habitsCount:
                    type: integer

components:
  schemas:
    Habit:
      type: object
      required:
        - id
        - name
        - category
        - frequency
        - color
        - icon
        - createdAt
        - completedDates
        - currentStreak
        - longestStreak
      properties:
        id:
          type: string
          example: 'habit-101'
        name:
          type: string
          example: 'Leer 20 minutos'
        description:
          type: string
          example: 'Lectura de libros de desarrollo y ciencia ficción'
        category:
          type: string
          example: 'Estudio'
        frequency:
          type: string
          enum: [daily, weekdays, weekends]
          example: 'daily'
        color:
          type: string
          example: '#4facfe'
        icon:
          type: string
          example: 'book-open'
        createdAt:
          type: string
          format: date-time
        completedDates:
          type: array
          items:
            type: string
            format: date
          example: ['2026-11-04', '2026-11-05']
        currentStreak:
          type: integer
          example: 5
        longestStreak:
          type: integer
          example: 14

    CreateHabitDto:
      type: object
      required:
        - name
        - category
        - frequency
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        frequency:
          type: string
          enum: [daily, weekdays, weekends]
        color:
          type: string
        icon:
          type: string

    UpdateHabitDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        frequency:
          type: string
        color:
          type: string
        icon:
          type: string

    CheckInResult:
      type: object
      properties:
        habitId:
          type: string
        completed:
          type: boolean
        date:
          type: string
          format: date
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        milestoneUnlocked:
          type: string
          nullable: true

    DashboardStats:
      type: object
      properties:
        totalHabits:
          type: integer
        completedToday:
          type: integer
        completionRate:
          type: number
          description: Porcentaje entre 0 y 100
        averageStreak:
          type: number
        maxStreak:
          type: integer
        weeklyProgress:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              completed:
                type: integer
              total:
                type: integer
              rate:
                type: number
        motivationalQuote:
          type: string
          example: '¡Imparable! Has completado el 100% de tus objetivos hoy.'
